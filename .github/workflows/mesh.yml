name: mesh-runner-24-7

on:
  schedule:
    - cron: "*/30 * * * *"   # Автоматический запуск каждые 30 минут 24/7
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-mesh-cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Запуск автономного раннера VETTO (4 Провайдера + Супер-Память)
        id: runner
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || github.token }}
          B_AI_API_KEY: ${{ secrets.B_AI_API_KEY }}
          NVIDIA_NIM_API_KEY: ${{ secrets.NVIDIA_NIM_API_KEY }}
          OPENCODE_ZEN_API_KEY: ${{ secrets.OPENCODE_ZEN_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          node runner.bundle.js

      - name: Пуш изолированной ветки day_X:Y в закрытый vetto-sandbox и запуск тестов
        env:
          GH_PAT: ${{ secrets.GH_TOKEN || github.token }}
        run: |
          git config user.name "vetto-mesh-bot"
          git config user.email "bot@vetto-mesh.local"
          
          # Получаем имя ветки из последнего отчета
          LATEST_REPORT=$(ls -t reports/mvp/*.md 2>/dev/null | head -n 1 || echo "")
          if [ -n "$LATEST_REPORT" ]; then
            BRANCH_RAW=$(basename "$LATEST_REPORT" .md)
            CLEAN_BRANCH_NAME=$(echo "$BRANCH_RAW" | tr ':' '-')
            echo "Пуш ветки: $CLEAN_BRANCH_NAME в geminifreefg-hash/vetto-sandbox"

            git clone https://x-access-token:${{ secrets.GH_TOKEN }}@github.com/geminifreefg-hash/vetto-sandbox.git sandbox_repo 2>/dev/null || true
            if [ -d "sandbox_repo" ]; then
              cd sandbox_repo
              git checkout -b "$CLEAN_BRANCH_NAME" || git checkout "$CLEAN_BRANCH_NAME"
              mkdir -p reports
              cp "../$LATEST_REPORT" "reports/$BRANCH_RAW.md"
              git add .
              git commit -m "feat(agent): autonomous cycle $BRANCH_RAW with Super-Memory and Rationale [skip ci]" || echo "No changes"
              git push origin "$CLEAN_BRANCH_NAME" --force || echo "Push failed or branch exists"
              cd ..
            fi
          fi

          # Сохраняем Супер-Память и состояние в основном репо
          git add data/
          if git diff --cached --quiet; then
            echo "Нет изменений в данных памяти"
          else
            git commit -m "mesh: синхронизация Супер-Памяти [skip ci]"
            git push
          fi
